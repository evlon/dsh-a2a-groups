# Test, then publish to npm when a version tag is pushed.
#
# WHY A TAG, NOT EVERY PUSH
#
# Publishing on every push to master would burn version numbers on work-in-progress and make the published
# package a moving target. A tag is one deliberate act: the version in package.json and the tag must agree, and
# the publish is the point of the push.
#
# WHY THE VERSION IS CHECKED AGAINST THE TAG
#
# `npm publish` happily publishes 0.1.0 forty times if you let it — it fails instead, but only after the build,
# and the failure reads as an infrastructure problem. Comparing the tag to `package.json` up front turns that
# into one clear sentence.
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: dsh-a2a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dsh-a2a/package.json

      # No lockfile is committed, so `npm ci` cannot run. `--no-audit --no-fund` keeps the log readable.
      - name: install
        run: npm install --no-audit --no-fund

      - name: test
        run: npm run test:all

      # A build step that cannot fail still catches typos: it parses every shipped module.
      - name: syntax check every shipped file
        run: |
          set -e
          for f in $(git ls-files '*.js' 'lib/**/*.js' | grep -v node_modules); do
            node --check "$f" || { echo "syntax error in $f"; exit 1; }
          done
          echo "all files parse"

      - name: verify the MCP server answers initialize
        run: |
          set -e
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node lib/mcp-server.js 2>/dev/null > /tmp/mcp.out
          grep -q '"serverInfo"' /tmp/mcp.out || { echo "no serverInfo in response"; cat /tmp/mcp.out; exit 1; }
          echo "mcp initialize ok"

  publish:
    name: publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required by 'npm publish --provenance': it mints a sigstore attestation from the workflow identity,
    # and without this permission npm refuses outright rather than publishing unsigned.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dsh-a2a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: install
        run: npm install --no-audit --no-fund

      # Fail early and clearly rather than letting `npm publish` report a version conflict.
      - name: the tag must match package.json
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg confirmed"

      # `--access public` is required for a scoped package on first publish; publishConfig sets it too,
      # so this is belt-and-braces for the case where publishConfig is dropped by mistake.
      - name: publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: what was published
        run: |
          echo "published $(node -p "require('./package.json').name + '@' + require('./package.json').version")"