# AISIX resources — local development for the DSH × A2A × AISIX chain.
#
# Four A2A agents are registered:
#
#   mock-a2a           — the dependency-free test double (scripts/aisix-dev/mock-agent.mjs)
#                        running on the Windows side. Proves card rewriting, JSON-RPC
#                        forwarding, SSE relay, credential injection and ACL.
#   agent-group-host   — THE group host (standalone Node program, bin/agent-groups.js, port 3095).
#                        One entry serves every group: the group id travels in the request body,
#                        never in the URL.
#   agent-person-dev1  — a member DSH instance (port 3091).
#   agent-person-dev2  — a second member DSH instance (port 3093), for a genuinely remote join.
#
# Two namespaces, because they are two different things:
#
#   agent-group-host   ONE entry serves every group (a group is data, addressed by data.groupId).
#   agent-person-*     ONE entry per machine — the gateway can only forward a path to one address,
#                      so two people behind one entry would leave one of them unreachable.
#
# One caller key per person (recommended): each colleague gets their own plaintext key, and
# `allowed_agents` decides which agent they may reach. The plaintext below is DEV ONLY — the hash
# is what is stored.
#
#   plaintext : (set AISIX_DEV_CALLER_KEY; not committed)
#   sha256    : regenerate for your own key — see scripts/aisix-dev/aisix-dev.sh

_format_version: "1"

provider_keys: []
models: []

api_keys:
  - display_name: "niukl-dev"
    allowed_models: ["*"]
    # Explicit per-agent grant: no `allowed_agents` means NO A2A access at all.
    #
    # Exactly the agents registered below, no more. The old `agent-group*` / `group-*` wildcards
    # dated from the single-group-name design and are DELIBERATELY absent: a group is data inside
    # the payload (data.groupId), not an agent name, so there is no per-group entry to grant. A
    # wildcard here would re-teach a model to "add a gateway entry per group" — the exact mistake
    # this file exists to prevent.
    allowed_agents: ["mock-a2a", "agent-group-host", "agent-person-dev1", "agent-person-dev2"]
    # sha256 of the DEV caller key `dev-caller-key-not-a-secret` (the default in aisix-dev.sh and every
    # probe script). Pre-filled so `./aisix-dev.sh smoke` works out of the box — the old all-zero
    # placeholder made every fresh checkout fail smoke with 401, which reads as a gateway bug. To use
    # your OWN key, regenerate with:
    #   printf %s "your-caller-key" | sha256sum
    key_hash: "a85d1a349d20e140a139276aadca59c67364207a432cb058107b9dca32e5ceb3"

a2a_agents:
  - name: "mock-a2a"
    # The test double runs inside the same WSL network namespace as the
    # container (`--network host`), so loopback is the shortest, most reliable
    # path. Point this at the Windows LAN address only when the mock has to run
    # on Windows (it then must also be reachable *from inside* the container —
    # verified with bash's /dev/tcp, not just from the WSL shell).
    url: "http://127.0.0.1:3092/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    # The credential the GATEWAY holds for the upstream; it never reaches the caller.
    secret: "mock-upstream-token-2026"
    timeout_ms: 120000
    enabled: true

  - name: "agent-group-host"
    # THE GROUP HOST: the instance that actually stores groups, members, invites
    # and the feed. This is the entry a colleague's invite link points at.
    #
    # One entry serves every group. The group id travels in the request body, not
    # in the URL, so creating a group never means editing this file again — that
    # was the single worst piece of UX in the first design and it is gone.
    #
    # Port 3095, not 3092: 3092 is held by a WSL port-forward left over from the
    # mock image, which makes `listen` fail with EADDRINUSE while `netstat` shows
    # nothing — the shadow listener is on the WSL side.
    url: "http://127.0.0.1:3095/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    secret: "dev-host-token-not-a-secret"
    timeout_ms: 600000
    enabled: true

  - name: "agent-person-dev1"
    # A second DSH instance, kept as the "colleague" side of a two-instance demo:
    # it joins groups hosted by `agent-groups`, so the invite path is exercised
    # across two real processes rather than against itself.
    #
    # `127.0.0.1` on purpose. DSH runs on Windows and WSL mirrors it onto its own
    # loopback, so the container reaches it without crossing the WSL/Windows
    # boundary. Going through the LAN address (192.168.3.7) instead makes the
    # gateway's HTTP client hang for ~100s on this setup — measured, not
    # guessed — while the same request from the WSL shell answers in 2ms.
    url: "http://127.0.0.1:3091/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    # The credential the gateway holds for DSH; it never reaches a caller.
    secret: "dev-member-token-not-a-secret"
    timeout_ms: 600000
    enabled: true

  - name: "agent-person-dev2"
    # The third instance, so a two-person collaboration is exercised between two REAL member
    # processes rather than a member talking to the host that hosts it. With only 3091 the
    # "colleague" side is simulated; with this one, an invite minted on 3091 is redeemed on 3093
    # and the resulting membership is genuinely remote — the code path whose bugs (path rewriting,
    # remote credential lookup, not_member handling) never run in a single-instance demo.
    #
    # 127.0.0.1 for the same measured reason as the entry above: the WSL gateway mirrors Windows
    # loopback, while the LAN address hangs its HTTP client for ~100s.
    url: "http://127.0.0.1:3093/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    secret: "dev-member-token-3093-not-a-secret"
    timeout_ms: 600000
    enabled: true

guardrails: []
mcp_servers: []
cache_policies: []
observability_exporters: []
rate_limit_policies: []
oidc_providers: []