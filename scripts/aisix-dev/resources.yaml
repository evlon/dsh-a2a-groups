# AISIX resources — local development for the DSH × A2A × AISIX chain.
#
# Two A2A agents are registered so the same gateway proves both directions of
# the chain:
#
#   mock-a2a    — the dependency-free test double (scripts/aisix-dev/mock-agent.mjs)
#                 running on the Windows side. Proves card rewriting, JSON-RPC
#                 forwarding, SSE relay, credential injection and ACL.
#   dsh-group   — the future DSH "group host" (dsh-a2a plugin, port 3091).
#                 Disabled until the plugin exists; flip `enabled` when it does.
#
# One caller key per person (recommended): each colleague gets their own
# plaintext key, and `allowed_agents` decides which group they may reach. The
# plaintext below is DEV ONLY — the hash is what is stored.
#
#   plaintext : sk-dev-niukl-2026
#   sha256    : c60c4fcb4f33322be5dcc08d7c09fc982b84f8755d41243104ab9d96d0b6a0d7

_format_version: "1"

provider_keys: []
models: []

api_keys:
  - display_name: "niukl-dev"
    allowed_models: ["*"]
    # Explicit per-agent grant: no `allowed_agents` means NO A2A access at all.
    allowed_agents: ["mock-a2a", "agent-groups", "agent-group*", "group-*"]
    key_hash: "c60c4fcb4f33322be5dcc08d7c09fc982b84f8755d41243104ab9d96d0b6a0d7"

a2a_agents:
  - name: "mock-a2a"
    # The test double runs inside the same WSL network namespace as the
    # container (`--network host`), so loopback is the shortest, most reliable
    # path. Point this at the Windows LAN address only when the mock has to run
    # on Windows (it then must also be reachable *from inside* the container —
    # verified with bash's /dev/tcp, not just from the WSL shell).
    url: "http://127.0.0.1:3092/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    # The credential the GATEWAY holds for the upstream; it never reaches the caller.
    secret: "mock-upstream-token-2026"
    timeout_ms: 120000
    enabled: true

  - name: "agent-groups"
    # THE GROUP HOST: the instance that actually stores groups, members, invites
    # and the feed. This is the entry a colleague's invite link points at.
    #
    # One entry serves every group. The group id travels in the request body, not
    # in the URL, so creating a group never means editing this file again — that
    # was the single worst piece of UX in the first design and it is gone.
    #
    # Port 3095, not 3092: 3092 is held by a WSL port-forward left over from the
    # mock image, which makes `listen` fail with EADDRINUSE while `netstat` shows
    # nothing — the shadow listener is on the WSL side.
    url: "http://127.0.0.1:3095/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    secret: "agent-groups-host-token-2026"
    timeout_ms: 600000
    enabled: true

  - name: "dsh-group"
    # A second DSH instance, kept as the "colleague" side of a two-instance demo:
    # it joins groups hosted by `agent-groups`, so the invite path is exercised
    # across two real processes rather than against itself.
    #
    # `127.0.0.1` on purpose. DSH runs on Windows and WSL mirrors it onto its own
    # loopback, so the container reaches it without crossing the WSL/Windows
    # boundary. Going through the LAN address (192.168.3.7) instead makes the
    # gateway's HTTP client hang for ~100s on this setup — measured, not
    # guessed — while the same request from the WSL shell answers in 2ms.
    url: "http://127.0.0.1:3091/a2a"
    protocol_version: "1.0"
    auth_type: "api_key"
    # The credential the gateway holds for DSH; it never reaches a caller.
    secret: "dsh-a2a-dev-token-2026"
    timeout_ms: 600000
    enabled: true

guardrails: []
mcp_servers: []
cache_policies: []
observability_exporters: []
rate_limit_policies: []
oidc_providers: []